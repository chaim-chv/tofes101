name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun install --frozen-lockfile
      - name: Knowledge base (no broken links, no orphans)
        run: bun run kb:check
      - name: Unit tests
        run: bun test
      - name: Typecheck
        run: bun run typecheck
      - name: Static build
        run: bun run generate
      - name: Privacy gate (no external hosts, CSP present)
        run: bun run check:privacy
      - name: E2E + axe
        run: bun run e2e:ci
